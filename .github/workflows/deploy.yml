# Builds the site and publishes it to GitHub Pages on every push to main, so that a
# merge is a publish and your laptop does not have to be awake for it (design §6).
#
# Before the first run, set Settings > Pages > Build and deployment > Source to
# "GitHub Actions".

name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # `make build` reads data/ with PyYAML, so the deploy needs it too - same pin as
      # the test workflow, so the site is built by the library the tests ran against.
      - run: pip install pyyaml==6.0.3
      - run: make build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
