# Runs the project's own test entry point - `make test` - on every pull request.

name: test

on:
  pull_request:
  push:
    branches: [main]

# Reading the checkout is all the tests need; nothing here writes to the repository.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The project's one dependency (pyproject.toml declares PyYAML>=6.0,<7); pinned
      # to an exact release here so that somebody else's publish cannot change what
      # this workflow tests.
      - run: pip install pyyaml==6.0.3
      - run: make test
