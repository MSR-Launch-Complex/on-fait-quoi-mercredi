# Runs the project's own test entry point - `make test` - on every pull request.

name: test

on:
  pull_request:
  push:
    branches: [main]

# Reading the checkout is all the tests need; nothing here writes to the repository.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The build needs nothing. PyYAML is here only so the reader's cross-check
      # against real YAML runs in CI instead of skipping; pinned so that a release of
      # somebody else's library cannot change what this workflow tests.
      - run: pip install pyyaml==6.0.2
      - run: make test
