notes_fr: "Approche technique et créative des arts du cirque : jonglerie, aériens, acrobaties, équilibre sur objets, expression. Cours hebdomadaires d'1h30 de septembre à juin, les mercredis, jeudis ou vendredis, avec un spectacle de fin d'année fin juin. L'École de cirque du Parmelan est agréée par la Fédération Française des Écoles de cirque."
