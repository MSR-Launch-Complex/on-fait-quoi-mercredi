notes_fr: "Les inscriptions aux mercredis scolaires se font à la journée complète avec repas, le matin avec repas, ou l'après-midi sans repas. Arrivées le matin de 8h à 9h et l'après-midi de 13h30 à 14h ; départs le midi de 13h30 à 14h et le soir de 17h à 18h. Le planning des mercredis est publié par groupe, de la petite section aux plus grands."
