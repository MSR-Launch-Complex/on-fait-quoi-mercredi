notes_fr: "Tous les mercredis en période scolaire, le Sou accueille les enfants de 3 à 12 ans au centre de loisirs de l'école de Novel, à la journée ou à la demi-journée, avec ou sans repas. Accueil le matin entre 8h et 9h, l'après-midi entre 13h et 13h30, le soir entre 17h30 et 18h. Inscriptions par trimestre, par mail."
