# Runs the project's own test entry point on every pull request.
#
# Install this file as .github/workflows/test.yml - see docs/ci/README.md for why it is
# not already there.

name: test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The build needs nothing. PyYAML is here only so the reader's cross-check
      # against real YAML runs in CI instead of skipping.
      - run: pip install pyyaml
      - run: make test
